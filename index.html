<!DOCTYPE html>
<html>
<head>
  <title>DSA Visualizer</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="home">

  <h1 class="main-title">
    <span class="icon">🚀</span> DSA Visualizer
  </h1>

  <p class="subtitle">Visualize Algorithms Step-by-Step</p>

  <div class="algo-grid">
    <button onclick="go('bubble')">🔵 Bubble Sort</button>
    <button onclick="go('selection')">🟣 Selection Sort</button>
    <button onclick="go('insertion')">🟡 Insertion Sort</button>
    <button onclick="go('merge')">🟢 Merge Sort</button>
    <button onclick="go('linear')">🔍 Linear Search</button>
    <button onclick="go('binary')">🔎 Binary Search</button>
  </div>

</div>

<script>
function go(algo){
  window.location.href = "visualizer.html?algo=" + algo;
}
</script>

</body>
</html>
